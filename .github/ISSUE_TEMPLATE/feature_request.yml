name: Feature Request
description: Suggest a new feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What kind of solution do you have in mind?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Are there other solutions you have considered?
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Agent
        - Command
        - Hook
        - Skill
        - CLI
        - Plugin
        - Other
    validations:
      required: true
